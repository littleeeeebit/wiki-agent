name: Verification
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'ci-final')) && format('Final {0} {1}', inputs.head || github.event.pull_request.head.sha, inputs.base_oid || github.event.pull_request.base.sha) || format('Pending review {0}', github.event.pull_request.head.sha) }}

on:
  workflow_dispatch:
    inputs:
      head:
        description: Exact reviewed commit
        required: true
        type: string
      base_oid:
        description: Reviewed merge base
        required: true
        type: string
  # A new commit cancels the previous candidate without starting another full suite.
  # The label also bootstraps this workflow before it first reaches main.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: >-
    verification-${{ (github.event_name == 'workflow_dispatch' || github.event.action == 'synchronize' || (github.event.action == 'labeled' && github.event.label.name == 'ci-final')) && (github.head_ref || github.ref_name) || format('event-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  WIKI_SEARCH: 'off'
  WIKI_JEV_FALLBACK: 'off'

jobs:
  identity:
    name: Identity and static checks
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'ci-final')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the run to its requested commit and base
        env:
          EXPECTED_HEAD: ${{ inputs.head || github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ inputs.base_oid || github.event.pull_request.base.sha }}
          DISPATCH_HEAD: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          head, base = os.environ['EXPECTED_HEAD'], os.environ['EXPECTED_BASE']
          assert all(re.fullmatch(r'[0-9a-f]{40}', value) for value in (head, base))
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == head
          merge_base = subprocess.check_output(['git', 'merge-base', head, base], text=True).strip()
          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              assert merge_base == base, 'The requested merge base is not an ancestor'
              assert os.environ['DISPATCH_HEAD'] == head, 'The branch moved before dispatch'
          print(f'Tested identity: {head}; merge base: {merge_base}')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check tool laya
      - run: python tool/lint.py --check
      - run: python tool/debt.py check

  python:
    needs: identity
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install chromium
      - name: Full Windows suite, including owned native fixtures
        run: python -m pytest tool -n 4 --maxfail=0 --durations=25 --junitxml=pytest-windows.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-windows
          path: pytest-windows.xml
          retention-days: 3

  laya:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # Run separately: Laya and the application have distinct bare module namespaces.
      - run: python -m pytest laya -n 0 --durations=15 --junitxml=pytest-laya.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pytest-laya
          path: pytest-laya.xml
          retention-days: 3

  web:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.head || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web run build
      - run: python web/tests/task_browser.py
