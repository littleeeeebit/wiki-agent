<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1f25" />
    <title>wiki-agent · 연결 끊김</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: dark; font-family: system-ui, sans-serif; background: #14161a; color: #eceae5; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 384px); padding: 24px; border: 1px solid #2e333b; border-radius: 8px; background: #1c1f25; }
      h1 { margin: 0 0 12px; font-size: 20px; }
      p { margin: 0 0 20px; font-size: 16px; line-height: 1.6; color: #a8aeb6; }
      button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 6px; background: #7fa9c9; color: #14161a; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>PC에 연결할 수 없습니다</h1>
      <p>PC와 외부 연결을 켠 뒤 다시 시도하세요. 대화와 작업 기록은 휴대폰에 저장되지 않습니다.</p>
      <button type="button" onclick="location.reload()">다시 연결</button>
    </main>
  </body>
</html>
